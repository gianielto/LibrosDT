name: CI

on:
  push:
    branches:
      - main
      - feature/CI

  pull_request:
    branches:
      - main
      - feature/CI

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node JS
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verificar Node
        run: node -v
